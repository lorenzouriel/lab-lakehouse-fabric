# SQL Server, PostgreSQL and MongoDB for the generated datasets - the database sources the Fabric lakehouse ingests.
# Settings come from .env (copy .env.example). Every value has a default, so `docker compose up -d` also works without one.
#
#   docker compose up -d --wait                      start the three databases (or name one: up -d postgres)
#   uv run generator load                            load the generated data into them
#   docker compose down                              stop (data volumes are kept) | add -v to delete the data too
#
# ./data is mounted read-only at /lab, so the containers can run the generated load scripts with their own clients.
name: labsources

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: labsources-sqlserver
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:-LabSources_2026!}
      MSSQL_MEMORY_LIMIT_MB: ${SQLSERVER_MEMORY_MB:-2048}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1440}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./data:/lab:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:17
    container_name: labsources-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labsources}
      POSTGRES_DB: ${POSTGRES_DATABASE:-labsources}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/lab:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:8
    container_name: labsources-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-labsources}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-labsources}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./data:/lab:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ping: 1}).ok\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  sqlserver_data:
  postgres_data:
  mongo_data:
