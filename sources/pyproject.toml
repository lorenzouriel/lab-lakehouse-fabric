[project]
name = "lab-sources-generator"
version = "0.2.0"
description = "Seeded, reproducible generator for the Fruit Juice (Sucos de Frutas) foundation dataset"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyarrow>=15"]

[project.scripts]
generator = "generator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "sqlglot>=25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
